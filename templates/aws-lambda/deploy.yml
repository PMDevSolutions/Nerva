# Deploys the API to AWS Lambda via SAM using GitHub OIDC -- no long-lived
# AWS access keys are stored in the repository.
#
# One-time AWS setup:
#   1. Create the GitHub OIDC identity provider in IAM:
#        Provider URL: https://token.actions.githubusercontent.com
#        Audience:     sts.amazonaws.com
#   2. Create an IAM role that trusts the provider, scoped to this repository:
#        "token.actions.githubusercontent.com:sub": "repo:<org>/<repo>:ref:refs/heads/main"
#      Grant it permissions for CloudFormation, Lambda, API Gateway, the SAM
#      artifact S3 bucket, and iam:PassRole for the function execution role.
#   3. Configure the repository:
#        variable AWS_REGION           e.g. us-east-1
#        secret   AWS_DEPLOY_ROLE_ARN  the role ARN from step 2
#        secrets  DATABASE_URL, JWT_SECRET
#
# Docs: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services

name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC federation
  contents: read

concurrency:
  group: deploy-aws-lambda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Bundle for Lambda
        run: pnpm run build:lambda

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        run: >-
          sam deploy
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          "DatabaseUrl=${{ secrets.DATABASE_URL }} JwtSecret=${{ secrets.JWT_SECRET }}"
