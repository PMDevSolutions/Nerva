# Local development database for AWS Lambda projects. Production uses RDS or
# Aurora (via RDS Proxy); this compose file only provides PostgreSQL for
# `pnpm dev` and the test suite.
services:
  postgres:
    image: postgres:17-alpine
    container_name: nerva-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nerva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerva_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nerva_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nerva} -d ${POSTGRES_DB:-nerva_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
